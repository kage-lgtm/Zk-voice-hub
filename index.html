<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - ZK Voice Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen">

    <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md mx-4 relative z-10">
        
        <!-- Tab Switcher (Sign In / Sign Up) -->
        <div class="flex bg-gray-950 p-1 rounded-xl mb-6 border border-gray-800">
            <button type="button" id="tab-signin" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-red-600 text-white shadow-md cursor-pointer">Sign In</button>
            <button type="button" id="tab-signup" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white cursor-pointer">Sign Up</button>
        </div>

        <!-- Header -->
        <div class="text-center mb-6">
            <h1 id="form-title" class="text-2xl font-bold tracking-tight text-white mb-1">Welcome Back</h1>
            <p id="form-subtitle" class="text-gray-400 text-xs">Sign in to your ZK Voice Hub account</p>
        </div>

        <!-- Error / Success Box -->
        <div id="message-box" class="hidden mb-4 p-3 text-sm rounded-lg border"></div>

        <!-- Auth Form -->
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Email address</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2.5 bg-gray-950 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-red-600 text-sm"
                    placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2.5 bg-gray-950 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-red-600 text-sm"
                    placeholder="••••••••">
            </div>

            <div id="signin-options" class="flex items-center justify-between text-xs text-gray-400">
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" id="remember-me" class="rounded bg-gray-950 border-gray-700 text-red-600 focus:ring-0 mr-1.5">
                    Remember Me
                </label>
                <a href="#forgot" id="forgot-link" class="text-red-500 hover:underline cursor-pointer">Forgot password?</a>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition duration-200 text-sm shadow-md cursor-pointer">
                Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="relative flex py-4 items-center">
            <div class="flex-grow border-t border-gray-800"></div>
            <span class="flex-shrink mx-4 text-gray-500 text-[10px] uppercase tracking-wider">OR</span>
            <div class="flex-grow border-t border-gray-800"></div>
        </div>

        <!-- Google Sign-In Button -->
        <button type="button" id="google-login-btn" 
            class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg transition duration-200 flex items-center justify-center space-x-2 text-sm shadow-md cursor-pointer">
            <svg class="w-4 h-4 fill-current pointer-events-none" viewBox="0 0 24 24">
                <path d="M12.24 10.285V14.2h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0 5.48 0 0 5.48 0 12.24s5.48 12.24 12.24 12.24c7.057 0 11.733-4.962 11.733-11.969 0-.829-.082-1.462-.18-2.226H12.24z"/>
            </svg>
            <span class="pointer-events-none">Sign in with Google</span>
        </button>

        <!-- Footer / Copyright -->
        <div class="text-center mt-6 text-[11px] text-gray-500">
            <p>Copyright © ZK Voice Hub. All rights reserved.</p>
            <div class="mt-1 space-x-1">
                <a href="#" class="hover:underline">Terms</a><span>|</span>
                <a href="#" class="hover:underline">Copyright Policy</a><span>|</span>
                <a href="#" class="hover:underline">Abuse Report</a>
            </div>
        </div>

    </div>

    <!-- Safe Script Initialization -->
    <script>
        const SUPABASE_URL = 'https://nveowfitvoligqecxofr.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // <--- Yahan apni Supabase anon key paste kar dena

        let supabase = null;
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.error("Supabase init error:", err);
        }

        let currentMode = 'signin';

        const signinTab = document.getElementById('tab-signin');
        const signupTab = document.getElementById('tab-signup');
        const title = document.getElementById('form-title');
        const subtitle = document.getElementById('form-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const signinOptions = document.getElementById('signin-options');

        // Tab Switchers
        if (signinTab && signupTab) {
            signinTab.addEventListener('click', () => {
                currentMode = 'signin';
                signinTab.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-red-600 text-white shadow-md cursor-pointer";
                signupTab.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white cursor-pointer";
                title.textContent = "Welcome Back";
                subtitle.textContent = "Sign in to your ZK Voice Hub account";
                submitBtn.textContent = "Sign In";
                if(signinOptions) signinOptions.classList.remove('hidden');
                hideMessage();
            });

            signupTab.addEventListener('click', () => {
                currentMode = 'signup';
                signupTab.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-red-600 text-white shadow-md cursor-pointer";
                signinTab.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white cursor-pointer";
                title.textContent = "Create Account";
                subtitle.textContent = "Join ZK Voice Hub to stream anime";
                submitBtn.textContent = "Sign Up";
                if(signinOptions) signinOptions.classList.add('hidden');
                hideMessage();
            });
        }

        // Google Login Button
        const googleBtn = document.getElementById('google-login-btn');
        if (googleBtn) {
            googleBtn.addEventListener('click', async () => {
                if (!supabase) {
                    showMessage('Supabase client not initialized. Check your API key.', 'error');
                    return;
                }
                try {
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: window.location.origin }
                    });
                    if (error) showMessage(error.message, 'error');
                } catch (e) {
                    showMessage('Google Sign-In failed: ' + e.message, 'error');
                }
            });
        }

        // Forgot Password Link
        const forgotLink = document.getElementById('forgot-link');
        if (forgotLink) {
            forgotLink.addEventListener('click', async (e) => {
                e.preventDefault();
                if (!supabase) {
                    showMessage('Supabase client not initialized.', 'error');
                    return;
                }
                const email = document.getElementById('email').value;
                if (!email) {
                    showMessage('Please enter your email address first.', 'error');
                    return;
                }
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin
                });
                if (error) {
                    showMessage(error.message, 'error');
                } else {
                    showMessage('Password reset link sent to your email!', 'success');
                }
            });
        }

        // Form Submit Handler
        const authForm = document.getElementById('auth-form');
        if (authForm) {
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!supabase) {
                    showMessage('Supabase client not initialized.', 'error');
                    return;
                }
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (currentMode === 'signin') {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        showMessage(error.message, 'error');
                    } else {
                        handleRedirect(data.user?.email);
                    }
                } else {
                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) {
                        showMessage(error.message, 'error');
                    } else {
                        showMessage('Sign up successful! Please check your email to confirm.', 'success');
                    }
                }
            });
        }

        function handleRedirect(email) {
            if (email === 'atrinandansarkate@gmail.com' || email === 'zkdubbingstudio@gmail.com') {
                window.location.href = '/admin.html';
            } else {
                window.location.href = '/index.html';
            }
        }

        function showMessage(text, type) {
            const box = document.getElementById('message-box');
            if (!box) return;
            box.textContent = text;
            box.className = `mb-4 p-3 text-sm rounded-lg border ${type === 'error' ? 'bg-red-950 border-red-800 text-red-200' : 'bg-green-950 border-green-800 text-green-200'}`;
            box.classList.remove('hidden');
        }

        function hideMessage() {
            const box = document.getElementById('message-box');
            if (box) box.classList.add('hidden');
        }
    </script>
</body>
</html>
